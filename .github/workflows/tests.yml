name: tests
on: [push, pull_request]
env:
  JOLT_VERSION: 0.8.24
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install jolt
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y liblz4-1 zlib1g libtinfo6
          # Install through jolt's own install script rather than resolving the
          # release asset here: it owns the archive and binary naming (which
          # changed in v0.5.0, when the CLI was renamed from joltc to jolt) and
          # verifies the checksum. Resolving the asset by hand left this workflow
          # chmod'ing a $HOME/.jolt/joltc that no release ships any more.
          # GitHub sometimes answers 504 for a few minutes (two runs failed with
          # curl exit 22 that way), so the install is tried three times.
          # --version saves the script's releases/latest lookup on api.github.com
          # and keeps a new jolt release from changing CI; bump JOLT_VERSION in
          # its own commit.
          for attempt in 1 2 3; do
            if curl -fsSL https://raw.githubusercontent.com/jolt-lang/jolt/main/install \
                 | bash -s -- --dir "$HOME/.jolt" --version "$JOLT_VERSION"; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "install failed (attempt $attempt), retrying in 30 s"
            sleep 30
          done
          echo "$HOME/.jolt" >> "$GITHUB_PATH"
      - name: Test
        run: JOLT_PWD="$PWD" jolt -M:test
